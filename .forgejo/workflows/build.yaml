          git config user.name "$(git log -1 --pretty=format:'%an')"
          git config user.email "$(git log -1 --pretty=format:'%ae')"
          git tag -f deploy-git-runner1
          git push origin deploy-git-runner1 --force
          ssh -i deploy.key -o StrictHostKeychecking=no git-runner1.home.pleunetowne.com 'systemctl reboot --when="+1 hour"'
      - name: Tag deploy
        run: |
          git config user.name "CI"
          git config user.email "ci@example.com"
          tag="deploy-git-runner1-$(date +'%Y%m%d%H%M%S')"
          git tag "$tag"
          git push origin "$tag"
