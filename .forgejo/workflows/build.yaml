          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Checkout
        uses: actions/checkout@v3
      - run: for i in {1..10}; do nix build --accept-flake-config .#mitchvim && break; done

