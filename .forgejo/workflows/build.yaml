          nix develop --accept-flake-config --command bash -c "deploy -s --ssh-opts '-o StrictHostKeychecking=no -i deploy.key' --fast-connection true .#git-runner1 --boot"
          ssh -i deploy.key -o StrictHostKeychecking=no git-runner1.home.pleunetowne.com 'systemctl reboot --when="+1 hour"'
      - name: Tag deploy
