name: nixflakes
on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: nix
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - run: nix flake check

  build-devshell:
    runs-on: nix
    needs: check
    steps:
      - name: deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PUB }}" > ~/.ssh/id_ed25519.pub && chmod 666 ~/.ssh/id_ed25519.pub
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Checkout
        uses: actions/checkout@v3
      - run: for i in {1..10}; do nix develop -c "true" && break; done

  build-mitchvim:
    runs-on: nix
    needs: check
    steps:
      - name: deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PUB }}" > ~/.ssh/id_ed25519.pub && chmod 666 ~/.ssh/id_ed25519.pub
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Checkout
        uses: actions/checkout@v3
