name: nixflakes
on: [push]

jobs:
  build:
    runs-on: nix
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Check
        run: nix flake check
      - name: Builds
        run: |
          nix develop -c "true"
          nix build .#mitchvim
          nixos-rebuild build --flake .#wsl
          nixos-rebuild build --flake .#lxc
          nixos-rebuild build --flake .#surface

  deploy-git:
    runs-on: nix
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Deploy
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > deploy.key && chmod 600 deploy.key
          nix develop --command bash -c "deploy -s --ssh-opts '-o StrictHostKeychecking=no -i deploy.key' --fast-connection true .#git"

  deploy-immich:
